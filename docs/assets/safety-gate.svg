<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="1000" height="300" rx="24" fill="#f4f1de"/>
  <text x="500" y="36" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#2b4a2f">The Safety Canopy — how confident is confident enough?</text>
  <!-- bar -->
  <rect x="60" y="70" width="880" height="34" rx="17" fill="#e5e0c8"/>
  <clipPath id="b"><rect x="60" y="70" width="880" height="34" rx="17"/></clipPath>
  <g clip-path="url(#b)">
    <rect x="60" y="70" width="528" height="34" fill="#e76f51"/>
    <rect x="588" y="70" width="176" height="34" fill="#f5b942"/>
    <rect x="764" y="70" width="176" height="34" fill="#2f8f4e"/>
  </g>
  <g font-size="12" fill="#2b4a2f" text-anchor="middle">
    <text x="60" y="124">0%</text><text x="588" y="124">60%</text><text x="764" y="124">80%</text><text x="940" y="124">100%</text>
  </g>
  <!-- cards -->
  <g font-size="13">
    <g transform="translate(60 150)"><rect width="205" height="130" rx="16" fill="#fff" stroke="#2f8f4e" stroke-width="2.5"/><text x="16" y="30" font-size="22">🟢</text><text x="46" y="30" font-weight="700" fill="#2b4a2f">HIGH</text><text x="16" y="56" fill="#4b5d45">p ≥ 0.80 and margin ≥ 0.10</text><text x="16" y="82" fill="#4b5d45">Full CIB&amp;RC chemical,</text><text x="16" y="100" fill="#4b5d45">organic and bio prescription</text></g>
    <g transform="translate(285 150)"><rect width="205" height="130" rx="16" fill="#fff" stroke="#f5b942" stroke-width="2.5"/><text x="16" y="30" font-size="22">🟡</text><text x="46" y="30" font-weight="700" fill="#2b4a2f">MEDIUM</text><text x="16" y="56" fill="#4b5d45">0.60 ≤ p &lt; 0.80</text><text x="16" y="82" fill="#4b5d45">Cultural practices and</text><text x="16" y="100" fill="#4b5d45">a second scouting pass</text></g>
    <g transform="translate(510 150)"><rect width="205" height="130" rx="16" fill="#fff" stroke="#e76f51" stroke-width="2.5"/><text x="16" y="30" font-size="22">🔴</text><text x="46" y="30" font-weight="700" fill="#2b4a2f">LOW / UNCERTAIN</text><text x="16" y="56" fill="#4b5d45">p &lt; 0.60</text><text x="16" y="82" fill="#4b5d45">Chemicals withheld,</text><text x="16" y="100" fill="#4b5d45">KVK referral slip issued</text></g>
    <g transform="translate(735 150)"><rect width="205" height="130" rx="16" fill="#fff" stroke="#c2703d" stroke-width="2.5"/><text x="16" y="30" font-size="22">🟠</text><text x="46" y="30" font-weight="700" fill="#2b4a2f">AMBIGUOUS</text><text x="16" y="56" fill="#4b5d45">top-2 margin &lt; 0.15</text><text x="16" y="82" fill="#4b5d45">Overlapping symptoms,</text><text x="16" y="100" fill="#4b5d45">chemicals withheld</text></g>
  </g>
</svg>
